<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MindGuard AI - Secure Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #0b1120 40%, #050816 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            backdrop-filter: blur(15px);
            width: 360px;
            text-align: center;
        }

        h2 {
            color: #c4b5fd;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        input::placeholder {
            color: #cbd5e1;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border-radius: 12px;
            background: #7c3aed;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #6d28d9;
        }

        .toggle {
            margin-top: 15px;
            font-size: 14px;
            color: #a78bfa;
            cursor: pointer;
        }

        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h2 id="title">Login</h2>

        <form id="authForm">

            <input type="text" id="username" placeholder="Username" required>

            <input type="email" id="email" placeholder="Email" style="display:none;">

            <input type="password" id="password" placeholder="Password (min 8 characters)" required>

            <input type="password" id="confirmPassword" placeholder="Confirm Password"
                style="display:none;">

            <button type="submit" id="submitBtn">Sign In</button>

            <div class="error-msg" id="errorMsg"></div>

        </form>

        <p class="toggle" onclick="toggleMode()" id="toggleText">
            Don't have an account? Register
        </p>
    </div>

    <script>

        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;

            document.getElementById("title").innerText =
                isLogin ? "Login" : "Create Account";

            document.getElementById("submitBtn").innerText =
                isLogin ? "Sign In" : "Sign Up";

            document.getElementById("toggleText").innerText =
                isLogin
                    ? "Don't have an account? Register"
                    : "Already have an account? Login";

            document.getElementById("email").style.display =
                isLogin ? "none" : "block";

            document.getElementById("confirmPassword").style.display =
                isLogin ? "none" : "block";

            document.getElementById("errorMsg").innerText = "";
        }

        document.getElementById("authForm").onsubmit = async (e) => {
            e.preventDefault();

            const errorMsg = document.getElementById("errorMsg");
            errorMsg.innerText = "";

            const username = document
                .getElementById("username")
                .value.trim();

            const email = document
                .getElementById("email")
                .value.trim()
                .toLowerCase();

            const password = document
                .getElementById("password")
                .value;

            const confirmPassword = document
                .getElementById("confirmPassword")
                .value;

            if (!isLogin) {

                if (username.length < 3) {
                    errorMsg.innerText =
                        "Username must be at least 3 characters.";
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailRegex.test(email)) {
                    errorMsg.innerText =
                        "Please enter a valid email address.";
                    return;
                }

                if (password.length < 8) {
                    errorMsg.innerText =
                        "Password must be at least 8 characters long.";
                    return;
                }

                if (password !== confirmPassword) {
                    errorMsg.innerText =
                        "Passwords do not match.";
                    return;
                }
            }

            const endpoint = isLogin ? "/login" : "/register";

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.removeItem("hasBeenWelcomed");
                    window.location.href = "/";
                } else {
                    errorMsg.innerText =
                        data.error || "Authentication failed.";
                }

            } catch (err) {
                errorMsg.innerText =
                    "Server error. Please try again.";
            }
        };

    </script>

</body>

</html>
