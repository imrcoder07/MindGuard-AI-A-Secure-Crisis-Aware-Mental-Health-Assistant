<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Serenity AI - Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #0b1120 40%, #050816 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            backdrop-filter: blur(15px);
            width: 350px;
            text-align: center;
        }

        h2 {
            color: #c4b5fd;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border-radius: 12px;
            background: #7c3aed;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle {
            margin-top: 15px;
            font-size: 14px;
            color: #a78bfa;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h2 id="title">Login</h2>
        <form id="authForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submitBtn">Sign In</button>
        </form>
        <p class="toggle" onclick="toggleMode()" id="toggleText">Don't have an account? Register</p>
    </div>

    <script>
        let isLogin = true;
        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? 'Login' : 'Create Account';
            document.getElementById('submitBtn').innerText = isLogin ? 'Sign In' : 'Sign Up';
            document.getElementById('toggleText').innerText = isLogin ? "Don't have an account? Register" : "Already have an account? Login";
        }

        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const endpoint = isLogin ? '/login' : '/register';
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await response.json();
            if (data.success) {
                // Clear old session welcome state
                sessionStorage.removeItem("hasBeenWelcomed");

                // Redirect after clearing
                window.location.href = "/";
            }
            else alert(data.error);
        };
    </script>
</body>

</html>
