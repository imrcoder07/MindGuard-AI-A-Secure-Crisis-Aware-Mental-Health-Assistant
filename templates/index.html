<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #0b1120 40%, #050816 100%);
            color: #e5e7eb;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .app {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.95);
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .new-chat-btn {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 12px;
            border-radius: 8px;
            color: #c4b5fd;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .new-chat-btn:hover {
            background: rgba(139, 92, 246, 0.25);
        }

        #conversationList {
            flex: 1;
            overflow-y: auto;
        }

        .nav-item {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .nav-item span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 170px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-weight: bold;
            padding: 5px;
            opacity: 0.5;
            transition: 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        /* Main Chat Area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .topnav {
            display: flex;
            justify-content: space-between;
            padding: 20px 40px;
            font-size: 14px;
            opacity: 0.8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: none;
            width: 100%;
            margin: 0;
            padding: 0 20px;
            min-height: 0;
        }

        .messages-wrapper {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px 0;
            width: 100%;
            scroll-behavior: smooth;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Bubble Alignment Logic */
        .message {
            max-width: 80%;
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            align-self: flex-end;
            margin-left: 10%;
            background: #7c3aed;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top-right-radius: 4px;
            border-bottom-left-radius: 18px;
        }

        .bot {
            align-self: flex-start;
            margin-right: 10%;
            margin-left: 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }

        /* Typing Indicator Styling */
        .typing {
            align-self: flex-start;
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-style: italic;
            display: none;
        }

        .input-dock {
            margin-top: 15px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.06);
            padding: 12px 18px;
            border-radius: 24px;
            display: flex;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-dock input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: white;
            font-size: 15px;
        }

        .input-dock button {
            background: #7c3aed;
            border: none;
            padding: 10px 22px;
            border-radius: 18px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .messages-wrapper::-webkit-scrollbar {
            width: 6px;
        }

        .messages-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .messages-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ---------------- Sidebar Footer ---------------- */

        .sidebar-footer {
            margin-top: auto;
            padding-top: 12px;
        }

        .sidebar-footer hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 12px 0;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            opacity: 0.9;
        }

        .username {
            color: #c4b5fd;
            font-weight: 500;
        }

        .logout-btn {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            transition: 0.2s;
        }

        .logout-btn:hover {
            text-decoration: underline;
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="welcomeOverlay"
        style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(5, 8, 22, 0.98); z-index:9999; display:flex; align-items:center; justify-content:center; backdrop-filter: blur(20px);">
        <div style="text-align:center; animation: fadeIn 0.8s ease;">
            <h1 style="color:#c4b5fd; font-size: 2.5rem; margin-bottom: 10px;">Hello, <span id="displayUsername"></span>
            </h1>
            <p style="color:#94a3b8; margin-bottom: 30px;">I'm here to listen. Shall we begin?</p>
            <button onclick="dismissWelcome()"
                style="padding:15px 40px; border-radius:30px; background:#7c3aed; color:white; border:none; font-weight:600; cursor:pointer; font-size: 1.1rem; box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);">Enter
                Sanctuary</button>
        </div>
    </div>

    <div class="app">
        <aside class="sidebar">
            <h2>Mental Health AI</h2>
            <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>

            <div id="conversationList"></div>

            <!-- Sidebar Footer (User + Logout) -->
            <div class="sidebar-footer">
                <hr>
                <div class="user-info">
                    <span class="username">{{ current_user.username }}</span>
                    <a href="{{ url_for('auth.logout') }}" class="logout-btn">
                        Logout
                    </a>
                </div>
            </div>
        </aside>

        <div class="main">
            <div class="topnav">
                <div>Dashboard</div>
                <div style="color: #c4b5fd;">Qwen 2.5 Powered</div>
            </div>

            <div class="chat-container">
                <div class="messages-wrapper" id="scrollContainer">
                    <div id="messages" class="messages"></div>
                    <div id="typingIndicator" class="typing">AI is thinking...</div>
                </div>

                <div class="input-dock">
                    <input id="input" placeholder="Share what’s on your mind..." autocomplete="off" />
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let conversationId = null;

        const scrollContainer = document.getElementById("scrollContainer");
        const messagesDiv = document.getElementById("messages");
        const typingIndicator = document.getElementById("typingIndicator");
        const userInput = document.getElementById("input");

        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        function isNearBottom() {
            return scrollContainer.scrollHeight - scrollContainer.scrollTop - scrollContainer.clientHeight < 120;
        }

        function addMessage(text, type) {
            const shouldAutoScroll = isNearBottom();

            const div = document.createElement("div");
            div.className = `message ${type}`;
            div.innerHTML = marked.parse(text);
            messagesDiv.appendChild(div);

            if (shouldAutoScroll) {
                scrollContainer.scrollTop = scrollContainer.scrollHeight;
            }
        }

        function startNewChat() {
            conversationId = null;
            messagesDiv.innerHTML = "";
            loadConversations();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, "user");
            userInput.value = "";

            typingIndicator.style.display = "block";
            scrollContainer.scrollTop = scrollContainer.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: text,
                        conversation_id: conversationId,
                        model: "llama"
                    })
                });

                const data = await response.json();
                typingIndicator.style.display = "none";

                if (!conversationId) conversationId = data.conversation_id;
                if (data.response) addMessage(data.response, "bot");

                loadConversations();

            } catch (e) {
                typingIndicator.style.display = "none";
                addMessage("I'm having trouble connecting right now.", "bot");
            }
        }

        async function loadConversations() {
            const response = await fetch("/conversations");
            const data = await response.json();

            const container = document.getElementById("conversationList");
            container.innerHTML = "";

            data.conversations.forEach(conv => {
                const div = document.createElement("div");
                div.className = `nav-item ${conv.id === conversationId ? 'active' : ''}`;

                const span = document.createElement("span");
                span.textContent = conv.preview || "New Chat";

                const delBtn = document.createElement("button");
                delBtn.className = "delete-btn";
                delBtn.innerHTML = "&times;";
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteConversation(conv.id);
                };

                div.onclick = () => loadConversation(conv.id);
                div.append(span, delBtn);
                container.appendChild(div);
            });
        }

        async function loadConversation(id) {
            const response = await fetch(`/conversations/${id}`);
            const data = await response.json();

            conversationId = id;
            messagesDiv.innerHTML = "";

            data.messages.forEach(msg =>
                addMessage(msg.content, msg.sender === "user" ? "user" : "bot")
            );

            loadConversations();
        }

        async function deleteConversation(id) {
            if (!confirm("Delete this conversation?")) return;

            await fetch(`/conversations/${id}`, { method: "DELETE" });

            if (conversationId === id) {
                startNewChat();
            } else {
                loadConversations();
            }
        }

        // -------------------------
        // WELCOME OVERLAY LOGIC
        // -------------------------

        document.addEventListener("DOMContentLoaded", function () {

            const overlay = document.getElementById("welcomeOverlay");
            const nameDisplay = document.getElementById("displayUsername");

            // Always load history
            loadConversations();

            // If already welcomed in this browser session
            if (sessionStorage.getItem("hasBeenWelcomed")) {
                if (overlay) overlay.style.display = "none";
                return;
            }

            // Set username from Flask template
            const name = "{{ current_user.username if current_user.is_authenticated else 'Guest' }}";
            if (nameDisplay) nameDisplay.innerText = name;
        });

        function dismissWelcome() {
            const overlay = document.getElementById("welcomeOverlay");
            if (!overlay) return;

            overlay.style.opacity = "0";
            overlay.style.transition = "opacity 0.5s ease";

            setTimeout(() => {
                overlay.style.display = "none";
                sessionStorage.setItem("hasBeenWelcomed", "true");

                addMessage("I'm glad you're here. How can I support you today?", "bot");
            }, 500);
        }
    </script>
</body>

</html>
